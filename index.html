<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zack. Hausmeister auf Abruf in Berlin</title>
<meta name="description" content="Kleine Reparaturen und Montage in Berlin: Möbel aufbauen, Lampen anschließen, Regale aufhängen. Wir sprechen Deutsch und Russisch.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --paper:#f4f1ea; --card:#fbf9f4; --raised:#ebe6dc;
    --ink:#151412; --sec:#55504a; --mute:#736d66;
    --line:rgba(21,20,18,.12); --line2:rgba(21,20,18,.2);
    --acc:#ff5b14; --acc-h:#ff6f30;
    --night:#151412; --night2:#1f1d1a; --nline:rgba(244,241,234,.12); --ntext:#f4f1ea; --nsec:#b3ada3;
    --ease:cubic-bezier(.22,1,.36,1);
    --disp:'Unbounded',system-ui,sans-serif; --sans:'Onest',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--paper); color:var(--ink); font:400 16px/26px var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .wrap { max-width:1280px; margin:0 auto; padding:0 32px; }
  .num { font-variant-numeric:tabular-nums; }
  svg.i { width:18px; height:18px; flex:none; }

  /* шкала рулетки — фирменная деталь */
  .ruler { height:24px; background:
      repeating-linear-gradient(90deg, var(--ink) 0 1.5px, transparent 1.5px 80px) 0 0/100% 24px no-repeat,
      repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 40px) 0 0/100% 14px no-repeat,
      repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 8px) 0 0/100% 7px no-repeat;
    opacity:.35; }
  .night .ruler { background:
      repeating-linear-gradient(90deg, var(--acc) 0 1.5px, transparent 1.5px 80px) 0 0/100% 24px no-repeat,
      repeating-linear-gradient(90deg, var(--ntext) 0 1px, transparent 1px 40px) 0 0/100% 14px no-repeat,
      repeating-linear-gradient(90deg, var(--ntext) 0 1px, transparent 1px 8px) 0 0/100% 7px no-repeat; opacity:.5; }

  /* header */
  header { position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); }
  .nav { height:72px; display:flex; align-items:center; gap:32px; }
  .logo { font:600 24px/1 var(--disp); letter-spacing:-.03em; text-decoration:none; }
  .logo span { color:var(--acc); }
  .links { display:flex; gap:28px; font-size:15px; color:var(--sec); }
  .links a { text-decoration:none; transition:color .15s var(--ease); }
  .links a:hover { color:var(--ink); }
  .lang { margin-left:auto; display:flex; background:var(--raised); border-radius:8px; padding:3px; }
  .lang button { height:30px; padding:0 10px; border:0; border-radius:6px; background:none; font:500 13px/1 var(--sans); color:var(--sec); cursor:pointer; transition:background-color .15s var(--ease), color .15s var(--ease); }
  .lang button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(21,20,18,.08); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px; padding:0 22px; border-radius:10px; border:1px solid transparent; font:500 16px/1 var(--sans); cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
  .btn:active { transform:scale(.98); }
  .btn.pri { background:var(--acc); color:var(--ink); }
  .btn.pri:hover { background:var(--acc-h); }
  .btn.sec { border-color:var(--line2); color:var(--ink); background:transparent; }
  .btn.sec:hover { background:var(--raised); }
  .btn.sm { height:40px; padding:0 16px; font-size:15px; }

  /* hero */
  .hero { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); gap:64px; align-items:center; padding-top:72px; padding-bottom:72px; }
  .eyebrow { display:flex; align-items:center; gap:8px; color:var(--sec); font-size:15px; margin-bottom:24px; }
  .live { width:8px; height:8px; border-radius:50%; background:#2f9e5b; box-shadow:0 0 0 3px rgba(47,158,91,.18); }
  h1 { font:600 84px/0.98 var(--disp); letter-spacing:-.045em; margin:0; }
  h1 em { font-style:normal; color:var(--acc); }
  html[lang=ru] h1 { font-size:68px; letter-spacing:-.04em; }
  .lead { font-size:20px; line-height:32px; color:var(--sec); max-width:34rem; margin:28px 0 36px; }
  .cta { display:flex; gap:12px; flex-wrap:wrap; }
  .langs-note { margin-top:28px; color:var(--mute); font-size:14px; display:flex; gap:8px; align-items:center; }

  /* Stundenzettel — главный объект */
  .ticket { position:relative; background:var(--card); border-radius:6px; padding:28px 28px 24px; transform:rotate(-2.5deg); box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 24px 48px -20px rgba(21,20,18,.35), 0 2px 6px rgba(21,20,18,.08); }
  .ticket::before { content:''; position:absolute; left:0; right:0; top:-6px; height:12px; background:radial-gradient(circle at 6px 6px, var(--paper) 4px, transparent 4.5px) 0 0/16px 12px repeat-x; }
  .ticket .th { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:16px; border-bottom:2px solid var(--ink); }
  .ticket .th b { font:600 18px/1 var(--disp); letter-spacing:-.02em; }
  .ticket .th span { color:var(--mute); font-size:13px; }
  .ticket .row { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px dashed var(--line2); font-size:15px; }
  .ticket .row span:first-child { color:var(--sec); }
  .ticket .sum { display:flex; justify-content:space-between; align-items:baseline; padding-top:18px; }
  .ticket .sum span { color:var(--sec); font-size:15px; }
  .ticket .sum b { font:600 40px/1 var(--disp); letter-spacing:-.03em; }
  .ticket .foot { margin-top:16px; color:var(--mute); font-size:13px; line-height:18px; }
  .stamp { position:absolute; right:-28px; top:-44px; width:116px; height:116px; border-radius:50%; border:3px solid var(--acc); color:var(--acc); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; transform:rotate(14deg); font:600 15px/1.1 var(--disp); letter-spacing:-.02em; opacity:.92; background:rgba(251,249,244,.6); }
  .stamp small { font:500 10px/1.2 var(--sans); letter-spacing:.02em; margin-top:4px; }

  /* sections */
  section { padding:112px 0; }
  .sec-h { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,26rem); gap:32px; align-items:end; margin-bottom:48px; }
  h2 { font:600 52px/1.02 var(--disp); letter-spacing:-.04em; margin:0; }
  .sec-h p { color:var(--sec); margin:0; }

  /* калькулятор услуг — второй главный элемент */
  .night { background:var(--night); color:var(--ntext); }
  .night h2 { color:var(--ntext); }
  .night .sec-h p { color:var(--nsec); }
  .calc { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:24px; align-items:start; }
  .tasks { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .task { display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:14px; min-height:76px; padding:12px 16px 12px 12px; border-radius:12px; border:1px solid var(--nline); background:var(--night2); color:var(--ntext); cursor:pointer; text-align:left; font:inherit; transition:border-color .15s var(--ease), background-color .15s var(--ease); }
  .task:hover { border-color:rgba(244,241,234,.28); }
  .task .ic { width:40px; height:40px; border-radius:8px; background:rgba(244,241,234,.06); display:flex; align-items:center; justify-content:center; color:var(--nsec); transition:background-color .15s var(--ease), color .15s var(--ease); }
  .task .t { font-weight:500; line-height:20px; }
  .task .d { color:var(--nsec); font-size:13px; line-height:18px; margin-top:2px; }
  .task .p { font-size:14px; color:var(--nsec); white-space:nowrap; }
  .task.on { border-color:var(--acc); background:#26201b; }
  .task.on .ic { background:var(--acc); color:var(--ink); }
  .task.on .p { color:var(--ntext); }
  .total { position:sticky; top:96px; background:var(--card); color:var(--ink); border-radius:16px; padding:24px; }
  .total .k { color:var(--sec); font-size:14px; }
  .total .big { font:600 56px/1 var(--disp); letter-spacing:-.04em; margin:8px 0 4px; }
  .total .lines { margin:20px 0; border-top:1px solid var(--line); }
  .total .lines div { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .total .lines span:first-child { color:var(--sec); }
  .total .btn { width:100%; }
  .total .fine { color:var(--mute); font-size:13px; line-height:18px; margin-top:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; min-height:28px; }
  .chips span { font-size:13px; line-height:18px; padding:4px 10px; border-radius:6px; background:var(--raised); color:var(--sec); }

  /* почему мы */
  .why { display:grid; grid-template-columns:repeat(4,1fr); border-top:2px solid var(--ink); }
  .why > div { padding:28px 28px 0 0; }
  .why > div + div { padding-left:28px; border-left:1px solid var(--line); }
  .why b { display:block; font:600 22px/1.15 var(--disp); letter-spacing:-.03em; margin-bottom:12px; }
  .why p { color:var(--sec); margin:0; font-size:15px; line-height:24px; }

  /* как это работает */
  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .step .n { font:600 64px/1 var(--disp); letter-spacing:-.05em; color:var(--raised); -webkit-text-stroke:1.5px var(--ink); margin-bottom:32px; }
  .step h3 { font:500 20px/26px var(--sans); margin:0 0 8px; }
  .step p { color:var(--sec); margin:0; font-size:15px; line-height:24px; }

  /* контакты */
  .contact { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:48px; align-items:start; }
  .quick { display:grid; gap:8px; margin-top:32px; }
  .quick a { display:flex; align-items:center; gap:14px; padding:18px 20px; border-radius:12px; background:var(--night2); border:1px solid var(--nline); text-decoration:none; transition:border-color .15s var(--ease); }
  .quick a:hover { border-color:var(--acc); }
  .quick a b { font-weight:500; display:block; }
  .quick a span { color:var(--nsec); font-size:14px; }
  .quick a svg { color:var(--acc); }
  .quick a .go { margin-left:auto; color:var(--nsec); }
  form { background:var(--card); color:var(--ink); border-radius:16px; padding:32px; display:grid; gap:16px; }
  label { display:grid; gap:6px; font-size:14px; color:var(--sec); }
  input, textarea { height:48px; border-radius:10px; border:1px solid var(--line2); background:var(--paper); padding:0 14px; font:400 16px var(--sans); color:var(--ink); transition:border-color .15s var(--ease); }
  textarea { height:auto; min-height:96px; padding:12px 14px; resize:vertical; }
  input:focus, textarea:focus { outline:none; border-color:var(--ink); }
  .fine { color:var(--mute); font-size:13px; line-height:18px; }
  .fine a { color:var(--sec); }

  footer { background:var(--night); color:var(--nsec); font-size:14px; padding:0 0 40px; }
  footer .wrap { display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; padding-top:32px; }
  footer nav { display:flex; gap:24px; }
  footer a { text-decoration:none; color:var(--ntext); }
  footer a:hover { color:var(--acc); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }

  main { overflow-x:clip; }
  .reveal { animation:rise .6s var(--ease) both; }
  .reveal.d2 { animation-delay:.12s; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }

  @media (max-width:1080px) {
    .links { display:none; }
    .hero, .calc, .contact { grid-template-columns:1fr; }
    .hero { gap:56px; }
    .ticket { max-width:420px; }
    h1, html[lang=ru] h1 { font-size:60px; }
    .why { grid-template-columns:repeat(2,1fr); }
    .why > div:nth-child(3) { border-left:0; padding-left:0; }
    .total { position:static; }
  }
  @media (max-width:640px) {
    .wrap { padding:0 20px; }
    .nav { gap:12px; }
    .nav .btn span { display:none; }
    .nav .btn { width:40px; padding:0; }
    .hero { padding-top:40px; padding-bottom:56px; }
    h1, html[lang=ru] h1 { font-size:40px; letter-spacing:-.04em; }
    .lead { font-size:17px; line-height:28px; }
    .cta .btn { flex:1; }
    .ticket { padding:24px 20px 20px; transform:rotate(-1.5deg); }
    .ticket .sum b { font-size:32px; }
    .stamp { width:92px; height:92px; right:-4px; top:-36px; font-size:12px; }
    section { padding:72px 0; }
    .sec-h { grid-template-columns:1fr; gap:16px; }
    h2 { font-size:34px; }
    .tasks { grid-template-columns:1fr; }
    .why { grid-template-columns:1fr; }
    .why > div, .why > div + div { padding:24px 0; border-left:0; border-bottom:1px solid var(--line); }
    .steps { grid-template-columns:1fr; }
    form { padding:24px 20px; }
  }
</style>
</head>

<script>

let lang = localStorage.getItem('zack-lang') || (navigator.language || '').startsWith('ru') && 'ru' || 'de';
const picked = new Set(['moebel', 'lampe', 'regal']);
const eur = n => n.toLocaleString(lang === 'de' ? 'de-DE' : 'ru-RU') + ' €';
const dur = m => m < 60 ? m + (lang === "de" ? " Min." : " мин") : hrs(m);
const hrs = m => (m / 60).toLocaleString(lang === 'de' ? 'de-DE' : 'ru-RU', { maximumFractionDigits: 1 }) + ' ' + T[lang].h;

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => {
    const v = T[lang][el.dataset.i]; if (v == null) return;
    el.hasAttribute('data-html') ? el.innerHTML = v : el.textContent = v;
  });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.getElementById('tasks').innerHTML = TASKS.map(t => `<button type="button" class="task ${picked.has(t.id) ? 'on' : ''}" aria-pressed="${picked.has(t.id)}" onclick="toggle('${t.id}')">
    <span class="ic"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${I[t.ic]}</svg></span>
    <span><div class="t">${t[lang][0]}</div><div class="d">${t[lang][1]}</div></span>
    <span class="p num">≈ ${dur(t.min)}</span></button>`).join('');
  const sel = TASKS.filter(t => picked.has(t.id));
  const raw = sel.reduce((a, t) => a + t.min, 0);
  const min = sel.length ? Math.max(60, Math.ceil(raw / 30) * 30) : 0;
  const work = min / 60 * RATE;
  document.getElementById('sumBig').textContent = sel.length ? eur(Math.round(work + DRIVE)) : '—';
  document.getElementById('sumTime').textContent = sel.length ? hrs(min) : '—';
  document.getElementById('sumWork').textContent = sel.length ? eur(Math.round(work)) : '—';
  document.getElementById('chips').innerHTML = sel.length ? sel.map(t => `<span>${t[lang][0]}</span>`).join('') : `<span>${T[lang].sum_none}</span>`;
  document.getElementById('fTask').placeholder = sel.map(t => t[lang][0]).join(', ');
}
function toggle(id) { picked.has(id) ? picked.delete(id) : picked.add(id); render(); }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; localStorage.setItem('zack-lang', lang); render(); });
document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  e.target.innerHTML = `<h3 style="font:600 28px/1.1 var(--disp);letter-spacing:-.03em;margin:0">${T[lang].f_done}</h3><p style="color:var(--sec);margin:0">${T[lang].f_done2}</p>`;
};
